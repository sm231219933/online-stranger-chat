name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fix activeUser TypeScript error
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/App.tsx")
          s = p.read_text()
          old = '''      let activeUser = user;
      if (!activeUser) {
        activeUser = await signInAnonymously(auth).then(r => r.user);
        setUser(activeUser);
      }
'''
          new = '''      const activeUser: User = user ?? (await signInAnonymously(auth)).user;
      setUser(activeUser);
'''
          if old not in s:
              raise SystemExit("activeUser block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build React app
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        uses: actions/deploy-pages@v4
