name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fix TypeScript activeUser narrowing
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/App.tsx")
          s = p.read_text(encoding="utf-8")
          old = '''      let activeUser = user;
      if (!activeUser) {
        activeUser = await signInAnonymously(auth).then(r => r.user);
        setUser(activeUser);
      }
      const current = { ...profile, uid: activeUser.uid };'''
          new = '''      const activeUser: User = user ?? (await signInAnonymously(auth)).user;
      setUser(activeUser);
      const current = { ...profile, uid: activeUser.uid };'''
          if old not in s:
              raise SystemExit("Expected activeUser block was not found")
          p.write_text(s.replace(old, new), encoding="utf-8")

      - name: Save TypeScript fix to GitHub
        run: |
          if git diff --quiet -- src/App.tsx; then
            echo "No source change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Fix activeUser TypeScript narrowing"
          git push

      - name: Build React app
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
