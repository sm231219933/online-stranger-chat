name: Build and deploy Stranger Chat Now to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare SPA navigation and call controls
        run: node scripts/prepare-build.mjs

      - name: Build React app
        run: npm run build

      - name: Copy SEO and verification files
        run: |
          cp google1d1c64e508cb6905.html dist/google1d1c64e508cb6905.html
          cp sitemap.xml dist/sitemap.xml
          cp robots.txt dist/robots.txt
          cp app-ads.txt dist/app-ads.txt

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: myai-88138858
          channelId: live
