name: Fix chat auto-scroll
on:
  push:
    paths:
      - '.github/workflows/fix-chat-scroll.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace('useEffect, useMemo, useState', 'useEffect, useMemo, useRef, useState', 1)
          old='const [saving,setSaving]=useState(false),[sending,setSending]=useState(false),[uploading,setUploading]=useState(false),[error,setError]=useState("")'
          new=old+';\n  const messagesRef=useRef<HTMLDivElement|null>(null)'
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)
          old='useEffect(()=>{if(!user||!selected)return;const id=[user.uid,selected.uid].sort().join("_");return onSnapshot(doc(db,"chats",id),s=>setMessages((s.data()?.messages||[]) as Message[]),e=>setError(`Chat error: ${e.message}`))},[user,selected]);'
          new=old+'\n  useEffect(()=>{const el=messagesRef.current;if(!el||!selected)return;const frame=window.requestAnimationFrame(()=>el.scrollTo({top:el.scrollHeight,behavior:"smooth"}));return()=>window.cancelAnimationFrame(frame)},[messages,selected]);'
          if old not in s: raise SystemExit('snapshot anchor not found')
          s=s.replace(old,new,1)
          old='<div className="messages">{messages.length===0&&'
          new='<div ref={messagesRef} className="messages">{messages.length===0&&'
          if old not in s: raise SystemExit('messages anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix chat auto-scroll to latest message'
          git push
